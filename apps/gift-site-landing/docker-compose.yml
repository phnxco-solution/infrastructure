name: gift-site-landing

services:
  # Named 'web' for consistency with the other Node/SPA projects. NOTE: the service name
  # is a DNS alias on traefik-public and is NOT unique — several projects publish 'web',
  # several publish 'nginx', and resolving either round-robins across all of them. Never
  # address another project by service name; use the container name (<project>-<service>-1),
  # which is unique.
  web:
    image: ghcr.io/phnxco-solution/gift-site-landing:latest
    restart: unless-stopped
    env_file: .env
    # Pinned here because environment overrides env_file: a HOST/PORT copied into .env from
    # the app README (defaults 127.0.0.1:5173) would move the listener off Traefik's port.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gift-site-landing.rule=Host(`pokloni-sajt.phnx-solution.com`)"
      - "traefik.http.routers.gift-site-landing.entrypoints=websecure"
      - "traefik.http.routers.gift-site-landing.tls=true"
      - "traefik.http.services.gift-site-landing.loadbalancer.server.port=3000"
      - "traefik.http.services.gift-site-landing.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.gift-site-landing.loadbalancer.healthcheck.interval=15s"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first, and the
      # server binds IPv4 only (HOST=0.0.0.0), so a localhost probe is always refused.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  traefik-public:
    external: true
