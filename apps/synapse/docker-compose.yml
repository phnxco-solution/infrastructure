name: synapse

services:
  app:
    image: ghcr.io/phnxco-solution/synapse:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
    volumes:
      - /opt/volumes/apps/synapse/storage:/var/www/html/storage
      - fpm-socket:/run/php
    networks:
      - backend
      - internal
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect /run/php/php-fpm.sock | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: ghcr.io/phnxco-solution/synapse-nginx:latest
    restart: unless-stopped
    volumes:
      - /opt/volumes/apps/synapse/storage/app/public:/var/www/html/public/storage:ro
      - fpm-socket:/run/php
    networks:
      traefik-public:
      # The voice service reaches Laravel's internal API here, on port 8080.
      internal:
        aliases:
          - synapse-nginx
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.synapse.rule=Host(`synapse.phnx-solution.com`)"
      - "traefik.http.routers.synapse.entrypoints=websecure"
      - "traefik.http.routers.synapse.tls=true"
      - "traefik.http.services.synapse.loadbalancer.server.port=80"
      # /up boots Laravel, which answers only for its own host (trusted hosts), so the check
      # sends that Host header.
      - "traefik.http.services.synapse.loadbalancer.healthcheck.path=/up"
      - "traefik.http.services.synapse.loadbalancer.healthcheck.hostname=synapse.phnx-solution.com"
      - "traefik.http.services.synapse.loadbalancer.healthcheck.interval=15s"
    deploy:
      resources:
        limits:
          memory: 64M

  worker:
    image: ghcr.io/phnxco-solution/synapse:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work redis --max-jobs=1000 --max-time=3600 --tries=3 --backoff=15 --timeout=90 --memory=128
    volumes:
      - /opt/volumes/apps/synapse/storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 120s
    healthcheck:
      # [a] keeps pgrep from matching this check's own shell.
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M

  scheduler:
    image: ghcr.io/phnxco-solution/synapse:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    volumes:
      - /opt/volumes/apps/synapse/storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      # [a] keeps pgrep from matching this check's own shell.
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # The voice service runs in two slots, so a release never cuts a live call: the release starts
  # the new image in the idle slot and stops the other once the new one is healthy. Both slots form
  # one Traefik service, which sends new calls only to a slot whose /up answers.
  voice-blue: &voice
    image: ghcr.io/phnxco-solution/synapse-voice:latest
    restart: unless-stopped
    init: true
    environment:
      # Laravel reads the same value from .env; stop_grace_period below must stay above it plus 15
      # seconds.
      VOICE_MAX_CALL_SECONDS: ${VOICE_MAX_CALL_SECONDS:-600}
      VOICE_SERVICE_SECRET: ${VOICE_SERVICE_SECRET:?Set VOICE_SERVICE_SECRET in .env}
      VOICE_LARAVEL_URL: http://synapse-nginx:8080
      VOICE_LARAVEL_HOST: synapse.phnx-solution.com
      # OpenAI where Laravel reaches it: eu.api.openai.com for a project with European data
      # residency, whose calls only that host knows.
      VOICE_OPENAI_URL: ${OPENAI_URL:-https://api.openai.com/v1}
      # How long the hangup of a SIP call waits after OpenAI reports the goodbye played, the time
      # its end takes to reach the caller.
      VOICE_SIP_PLAYOUT_MS: ${VOICE_SIP_PLAYOUT_MS:-1500}
    networks:
      traefik-public:
      # Laravel reaches the service here, and the service reaches Laravel at synapse-nginx.
      internal:
        aliases:
          - synapse-voice
    labels:
      - "traefik.enable=true"
      # Only Twilio's media streams reach the voice service; the rest of the host goes to nginx.
      - "traefik.http.routers.synapse-voice.rule=Host(`synapse.phnx-solution.com`) && Path(`/media-stream`)"
      - "traefik.http.routers.synapse-voice.entrypoints=websecure"
      - "traefik.http.routers.synapse-voice.tls=true"
      - "traefik.http.services.synapse-voice.loadbalancer.server.port=8090"
      # /up turns 503 while the service is stopping, so Traefik sends it no new call.
      - "traefik.http.services.synapse-voice.loadbalancer.healthcheck.path=/up"
      - "traefik.http.services.synapse-voice.loadbalancer.healthcheck.interval=5s"
    # Stopping, it waits for live calls to end, at most VOICE_MAX_CALL_SECONDS plus 15 seconds.
    stop_grace_period: 11m
    # Unhealthy, and so restarted by autoheal, only after a minute without an answer from /live:
    # a process that can't answer that long isn't carrying a call either.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/live > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M

  voice-green: *voice

# php-fpm's socket, shared only between app and nginx; on tmpfs, so it holds nothing to back up.
volumes:
  fpm-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=82,gid=82,mode=0755

networks:
  traefik-public:
    external: true
  backend:
    external: true
  # Only Synapse's own containers: the app, nginx and the voice service talk to each other here.
  internal: {}
