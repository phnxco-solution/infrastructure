name: unimaginable

services:
  app:
    image: ghcr.io/phnxco-solution/unimaginable:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
    volumes:
      - /opt/volumes/apps/unimaginable/storage:/var/www/html/storage
    networks:
      default:
        aliases:
          - unimaginable-fpm
      backend:
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: ghcr.io/phnxco-solution/unimaginable-nginx:latest
    restart: unless-stopped
    volumes:
      - /opt/volumes/apps/unimaginable/storage/app/public:/var/www/html/public/storage:ro
    networks:
      - default
      - traefik-public
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.unimaginable.rule=Host(`unimaginable.rs`)"
      - "traefik.http.routers.unimaginable.entrypoints=websecure"
      - "traefik.http.routers.unimaginable.tls=true"
      # API host — same app, but must never appear in search results (Google
      # indexed the landing page under api.unimaginable.rs). X-Robots-Tag on
      # every response deindexes it and keeps it out.
      - "traefik.http.routers.unimaginable-api.rule=Host(`api.unimaginable.rs`)"
      - "traefik.http.routers.unimaginable-api.entrypoints=websecure"
      - "traefik.http.routers.unimaginable-api.tls=true"
      - "traefik.http.routers.unimaginable-api.service=unimaginable"
      - "traefik.http.routers.unimaginable-api.middlewares=unimaginable-noindex"
      - "traefik.http.middlewares.unimaginable-noindex.headers.customresponseheaders.X-Robots-Tag=noindex"
      # www → apex 301: the www CNAME 404'd before this router existed.
      # $$ because compose expands $name in labels.
      - "traefik.http.routers.unimaginable-www.rule=Host(`www.unimaginable.rs`)"
      - "traefik.http.routers.unimaginable-www.entrypoints=websecure"
      - "traefik.http.routers.unimaginable-www.tls=true"
      - "traefik.http.routers.unimaginable-www.service=unimaginable"
      - "traefik.http.routers.unimaginable-www.middlewares=unimaginable-strip-www"
      - "traefik.http.middlewares.unimaginable-strip-www.redirectregex.regex=^https://www\\.unimaginable\\.rs/(.*)"
      - "traefik.http.middlewares.unimaginable-strip-www.redirectregex.replacement=https://unimaginable.rs/$${1}"
      - "traefik.http.middlewares.unimaginable-strip-www.redirectregex.permanent=true"
      - "traefik.http.services.unimaginable.loadbalancer.server.port=80"
      - "traefik.http.services.unimaginable.loadbalancer.healthcheck.path=/up"
      - "traefik.http.services.unimaginable.loadbalancer.healthcheck.interval=15s"
      # Horizon dashboard — basic auth at the edge (hash lives in apps/unimaginable/.env,
      # HORIZON_BASIC_AUTH — value MUST be single-quoted there: compose expands
      # $name inside unquoted .env values and silently truncates htpasswd hashes).
      # The app-side gate additionally requires HORIZON_DASHBOARD_OPEN=true, so an
      # unset hash fails closed.
      - "traefik.http.routers.unimaginable-horizon.rule=Host(`api.unimaginable.rs`) && PathPrefix(`/horizon`)"
      - "traefik.http.routers.unimaginable-horizon.entrypoints=websecure"
      - "traefik.http.routers.unimaginable-horizon.tls=true"
      - "traefik.http.routers.unimaginable-horizon.priority=100"
      - "traefik.http.routers.unimaginable-horizon.service=unimaginable"
      - "traefik.http.routers.unimaginable-horizon.middlewares=unimaginable-horizon-auth,unimaginable-noindex"
      - "traefik.http.middlewares.unimaginable-horizon-auth.basicauth.users=${HORIZON_BASIC_AUTH}"
    deploy:
      resources:
        limits:
          memory: 64M

  horizon:
    image: ghcr.io/phnxco-solution/unimaginable:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: horizon
    # Horizon master supervises per-queue worker pools (app config/horizon.php).
    # Grace must outlast the longest job (audio supervisor timeout 1500s); the
    # autoheal label overrides autoheal's 10s default stop timeout for the same
    # reason. Worker memory_limit (384M) is baked into the image — `-d` on the
    # master does not propagate to spawned workers.
    command: php artisan horizon
    volumes:
      - /opt/volumes/apps/unimaginable/storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 1530s
    labels:
      - "autoheal.stop.timeout=1530"
    healthcheck:
      # Exit codes: 0 running, 1 paused (still healthy), 2 inactive.
      test: ["CMD-SHELL", "php artisan horizon:status || [ $? -eq 1 ]"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M

  scheduler:
    image: ghcr.io/phnxco-solution/unimaginable:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    volumes:
      - /opt/volumes/apps/unimaginable/storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  default:
  traefik-public:
    external: true
  backend:
    external: true
