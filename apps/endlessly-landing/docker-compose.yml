name: endlessly-landing

services:
  # Named 'web' for consistency with the other Node/SPA projects. NOTE: the service name
  # is a DNS alias on traefik-public and is NOT unique — several projects publish 'web',
  # several publish 'nginx', and resolving either round-robins across all of them. Never
  # address another project by service name; use the container name (<project>-<service>-1),
  # which is unique.
  web:
    image: ghcr.io/phnxco-solution/endlessly-landing:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - /opt/volumes/apps/endlessly-landing/logs:/app/logs
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.endlessly-landing.rule=Host(`sajtzadvoje.rs`)"
      - "traefik.http.routers.endlessly-landing.entrypoints=websecure"
      - "traefik.http.routers.endlessly-landing.tls=true"
      # www and the old phnx-solution.com subdomain 301 to the apex, path and query kept.
      # $$ because compose expands $name in labels.
      - "traefik.http.routers.endlessly-landing-redirect.rule=Host(`www.sajtzadvoje.rs`) || Host(`sajt-za-dvoje.phnx-solution.com`)"
      - "traefik.http.routers.endlessly-landing-redirect.entrypoints=websecure"
      - "traefik.http.routers.endlessly-landing-redirect.tls=true"
      - "traefik.http.routers.endlessly-landing-redirect.service=endlessly-landing"
      - "traefik.http.routers.endlessly-landing-redirect.middlewares=endlessly-landing-to-apex"
      - "traefik.http.middlewares.endlessly-landing-to-apex.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.endlessly-landing-to-apex.redirectregex.replacement=https://sajtzadvoje.rs/$${1}"
      - "traefik.http.middlewares.endlessly-landing-to-apex.redirectregex.permanent=true"
      - "traefik.http.services.endlessly-landing.loadbalancer.server.port=3000"
      - "traefik.http.services.endlessly-landing.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.endlessly-landing.loadbalancer.healthcheck.interval=15s"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  traefik-public:
    external: true
