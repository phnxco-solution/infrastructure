name: {{APP_NAME}}

services:
  app:
    image: ghcr.io/phnxco-solution/{{APP_NAME}}:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
    volumes:
      - /opt/volumes/apps/{{APP_NAME}}/storage:/var/www/html/storage
      - fpm-socket:/run/php
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect /run/php/php-fpm.sock | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: ghcr.io/phnxco-solution/{{APP_NAME}}-nginx:latest
    restart: unless-stopped
    volumes:
      - /opt/volumes/apps/{{APP_NAME}}/storage/app/public:/var/www/html/public/storage:ro
      - fpm-socket:/run/php
    networks:
      - traefik-public
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{APP_NAME}}.rule=Host(`{{APP_DOMAIN}}`)"
      - "traefik.http.routers.{{APP_NAME}}.entrypoints=websecure"
      - "traefik.http.routers.{{APP_NAME}}.tls=true"
      - "traefik.http.services.{{APP_NAME}}.loadbalancer.server.port=80"
      - "traefik.http.services.{{APP_NAME}}.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.{{APP_NAME}}.loadbalancer.healthcheck.interval=15s"
    deploy:
      resources:
        limits:
          memory: 64M

  worker:
    image: ghcr.io/phnxco-solution/{{APP_NAME}}:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work redis --max-jobs=1000 --max-time=3600 --tries=3 --backoff=15 --timeout=90 --memory=128
    volumes:
      - /opt/volumes/apps/{{APP_NAME}}/storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 120s
    healthcheck:
      # [a] keeps pgrep from matching this check's own shell.
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M

  scheduler:
    image: ghcr.io/phnxco-solution/{{APP_NAME}}:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    volumes:
      - /opt/volumes/apps/{{APP_NAME}}/storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      # [a] keeps pgrep from matching this check's own shell.
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan schedule:work' > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

# php-fpm's socket, shared only between app and nginx; on tmpfs, so it holds nothing to back up.
volumes:
  fpm-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=82,gid=82,mode=0755

networks:
  traefik-public:
    external: true
  backend:
    external: true
